<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .plates {
      isolation: isolate;
    }
    .plates use {
      mix-blend-mode: multiply;
    }
    .dark-overlap {
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      .dark-overlap {
        display: inline;
      }
    }
  </style>
  <defs>
    <polygon
      id="hex"
      points="-1,0 -0.5,0.8660254 0.5,0.8660254 1,0 0.5,-0.8660254 -0.5,-0.8660254"
      transform="translate(32 32) scale(29)"
    />
    <use id="cyan" href="#hex" x="-1.3333" y="-0.8889" />
    <use id="magenta" href="#hex" x="1.3333" y="-0.4444" />
    <use id="yellow" href="#hex" y="1.3333" />
    <clipPath id="cyan-clip">
      <use href="#cyan" />
    </clipPath>
    <clipPath id="magenta-clip">
      <use href="#magenta" />
    </clipPath>
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <path
        d="M20 2C20 2 2 22 2 36A18 18 0 0 0 38 36C38 22 20 2 20 2Z"
        transform="translate(18 12) scale(0.7)"
        fill="#000"
      />
    </mask>
  </defs>
  <g mask="url(#cutout)">
    <g class="plates">
      <use href="#cyan" fill="#00aeef" />
      <use href="#magenta" fill="#ec008c" />
      <use href="#yellow" fill="#fff200" />
    </g>
    <g class="dark-overlap" clip-path="url(#cyan-clip)">
      <g clip-path="url(#magenta-clip)">
        <use href="#yellow" fill="#fff" />
      </g>
    </g>
  </g>
</svg>
